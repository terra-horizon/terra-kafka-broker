version: '3.8'

services:
  kafka:
    image: apache/kafka:latest
    container_name: terra-kafka-broker
    restart: unless-stopped
    labels:
      io.portainer.accesscontrol.teams: terra-team
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - terra-net

  kafka-rest:
    image: confluentinc/cp-kafka-rest:7.6.0
    container_name: terra-kafka-rest
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      KAFKA_REST_HOST_NAME: kafka-rest
      KAFKA_REST_BOOTSTRAP_SERVERS: 'kafka:9092'
      KAFKA_REST_LISTENERS: 'http://0.0.0.0:8082'
      KAFKAREST_HEAP_OPTS: "-Xmx256M -Xms128M"
    networks:
      - terra-net

  worker:
    image: losandriana/terra-kafka-worker:latest
    container_name: terra-kafka-worker
    restart: unless-stopped
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_GROUP_ID: terra-mongodb-worker
      MONGO_COLLECTION: usv_raw_data
      TERRA_STORAGE_ENABLED: "true"
    depends_on:
      - kafka
    networks:
      - terra-net

volumes:
  kafka_data:

networks:
 default:
   name: terra-network
   external: false
   labels:
     io.portainer.accesscontrol.teams: terra-team
